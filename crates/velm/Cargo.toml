[package]
name = "velm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Velm：基于 vello GPU 渲染与 Elm(TEA) 架构的 Android 零胶水 NativeActivity 2D GUI 框架"

[lib]
name = "velm"
crate-type = ["rlib"]

[dependencies]
log = "0.4"
# peniko 为纯 Rust（#![no_std]），host/android 均可编译：view/layout/hit_test
# 需要使用 peniko::Color 而不引入任何 android 符号（SPEC §10.2）。
peniko = "0.6"
# ADR-11：统一错误类型；纯 Rust，host/android 均可编译。
thiserror = "2"

[target.'cfg(target_os = "android")'.dependencies]
raw-ndk-sys = "0.1.2"
android_logger = "0.15"
crossbeam-channel = "0.5"
# T16 迁移（vello 0.10 → vello_gpu 0.2 / wgpu 29 → 30 / rwh 0.6 / pollster / peniko 0.6）。
# 注意：vello_gpu 的 wgpu 后端要求 wgpu 必须与它同源（同版本），故此处升到 30；
# 仅开 vulkan（Android 唯一后端），wgsl/std 供 vello_gpu_shaders 的 WGSL 加载。
wgpu = { version = "30", default-features = false, features = ["vulkan", "wgsl", "std"] }
pollster = "0.4"
raw-window-handle = "0.6"
# vello_gpu 0.2.0（Sparse Strips 架构，Renderer/Resources/Scene 等新 API）。
# 采用 path + version 双位置声明（Cargo 官方推荐发布写法）：本地开发走 `path`（仓库根的
# vello/，可编辑、保留 T16 本地迭代），`cargo publish` 时自动改用 crates.io 注册表版本。
# 注意：vello_gpu 尚未在 crates.io 正式发布（仅有 0.1.0 占位），故「发布」须等 linebender
# 先发布 vello_gpu 0.2.0；届时 `cargo publish -p velm` 即用注册表 0.2.0，无需改此清单。
vello_gpu = { path = "../../vello/vello_gpu", version = "0.2.0", default-features = false, features = ["wgpu", "text"] }
# vello_gpu 内部用 vello_common 的 peniko/kurbo/color，velm 渲染层与字体层直接复用同一份，
# 保证 peniko::Color/AlphaColor<Srgb> 类型同一（set_paint 接收 AlphaColor<Srgb>）。
vello_common = { path = "../../vello/vello_common", version = "0.2.0", default-features = false, features = ["std"] }
# 字形类型 `glifo::Glyph`：vello_gpu 的 `Scene::glyph_run().fill_glyphs()` 严格依赖它，
# 而 vello_gpu/vello_common 均未公开再导出该类型，故 velm 直接依赖 glifo 仓库
# （与 vello_gpu/vello_common 同源，peniko/vello_common 版本自然统一）。需 std（Android 可用）。
glifo = { path = "../../vello/glifo", version = "0.3.0", default-features = false, features = ["std"] }
# T2 Slice 3 文本（ADR-06：skrifa 直绘，与 vello 内部同版本 0.44）
skrifa = "0.44"
